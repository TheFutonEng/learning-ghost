apiVersion: v1
kind: Secret
metadata:
  name: step-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  ca.crt: {{ required "certificates.intermediate is required" .Values.certificates.intermediate }}
  root.crt: {{ required "certificates.root is required" .Values.certificates.root }}
  ca.key: {{ required "certificates.intermediateKey is required" .Values.certificates.intermediateKey }}
  password: {{ required "certificates.caPassword is required" .Values.certificates.caPassword }}
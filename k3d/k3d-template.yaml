apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: {{ .ClusterName }}
servers: {{ .K3dServers}}
agents: {{ .K3dAgents }}
kubeAPI:
  hostIP: "0.0.0.0"
  hostPort: "{{ .ApiServerPort }}"
ports:
  - port: {{ .ExternalHttpPort }}:80
    nodeFilters:
      - loadbalancer
  - port: {{ .ExternalHttpsPort }}:443
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  runtime:
    serversMemory: "{{ .ServersMemory }}"
    serversCPU: "{{ .ServersCPU }}"
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-wildcard
  namespace: ingress-controller
spec:
  secretName: local-tls
  duration: 24h # 24 hours
  renewBefore: 8h # renew when there's 8 hours left
  subject:
    organizations:
      - Local TLS
  commonName: "{{ .CommonName }}"
  dnsNames:
    - "{{ .DnsName }}"
  issuerRef:
    name: step-cluster-issuer
    kind: StepClusterIssuer
    group: certmanager.step.sm
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256